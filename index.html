<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа - Handyman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff5e14;
            --dark: #0f172a;
            --text: #334155;
            --bg: #f8fafc;
            --surface: #ffffff;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { color: var(--text); background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .checkout-container {
            background: var(--surface); max-width: 600px; width: 100%;
            padding: 40px; border-radius: var(--radius);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
        }

        .back-link { color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; transition: color 0.3s; }
        .back-link:hover { color: var(--primary); }

        h2 { color: var(--dark); margin-bottom: 25px; font-size: 28px; }

        .order-summary {
            background: var(--bg); padding: 20px; border-radius: 12px; margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }
        .order-summary h3 { font-size: 16px; margin-bottom: 15px; color: var(--dark); }
        .service-list { list-style: none; margin-bottom: 15px; }
        .service-list li { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
        .total-price { font-size: 24px; font-weight: 700; color: var(--primary); display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #e2e8f0; padding-top: 15px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--dark); }
        .form-group input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 16px; border-radius: 8px; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: #e04c0b; transform: translateY(-2px); }
        
        .empty-state { text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Вернуться к калькулятору</a>
        
        <div id="orderContent">
            <h2>Оформление заявки</h2>
            
            <div class="order-summary">
                <h3>Выбранные услуги (вакансии мастеров):</h3>
                <ul class="service-list" id="servicesList">
                    <!-- Заполняется через JS -->
                </ul>
                <div class="total-price">
                    <span>К оплате:</span>
                    <span id="finalPriceDisplay">0 ₽</span>
                </div>
            </div>

            <form id="checkoutForm">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" placeholder="Иван Иванов" required>
                </div>
                <div class="form-group">
                    <label>Номер телефона</label>
                    <input type="tel" placeholder="+7 (999) 000-00-00" required>
                </div>
                <div class="form-group">
                    <label>Адрес (Улица, дом, квартира)</label>
                    <input type="text" placeholder="г. Москва, ул. Пушкина, д. 10, кв. 5" required>
                </div>
                <button type="submit" class="btn-submit">Подтвердить заказ</button>
            </form>
        </div>

        <div class="empty-state" id="emptyState">
            <h2>Корзина пуста</h2>
            <p>Вы не выбрали ни одной услуги.</p>
            <br>
            <a href="index.html" class="btn-submit" style="text-decoration: none; display: inline-block;">Вернуться на главную</a>
        </div>
    </div>

    <script>
        // При загрузке страницы достаем данные из памяти браузера
        window.onload = function() {
            const orderDataString = localStorage.getItem('handyman_order');
            
            if (orderDataString) {
                const orderData = JSON.parse(orderDataString);
                
                // Если заказ на 0 рублей, показываем пустое состояние
                if (orderData.total === "0" || !orderData.total) {
                    document.getElementById('orderContent').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                const list = document.getElementById('servicesList');
                let urgencyText = "В течение 3 дней";
                if (orderData.urgency === 2) urgencyText = "Завтра (+20%)";
                if (orderData.urgency === 3) urgencyText = "Срочно, сейчас (+50%)";

                // Добавляем мастеров, которых выбрал клиент
                if (orderData.plumbing > 0) {
                    list.innerHTML += `<li><span>Мастер-сантехник</span> <span>${orderData.plumbing} точек</span></li>`;
                }
                if (orderData.electric > 0) {
                    list.innerHTML += `<li><span>Мастер-электрик</span> <span>${orderData.electric} точек</span></li>`;
                }
                if (orderData.furniture > 0) {
                    list.innerHTML += `<li><span>Мастер по мебели</span> <span>${orderData.furniture} часов</span></li>`;
                }
                
                list.innerHTML += `<li><span>Срочность:</span> <span>${urgencyText}</span></li>`;
                
                // Устанавливаем цену
                document.getElementById('finalPriceDisplay').innerText = orderData.total + ' ₽';
            } else {
                document.getElementById('orderContent').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
            }
        };

        // Имитация отправки формы
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Ваша заявка успешно отправлена! Мастер свяжется с вами в ближайшее время.');
            localStorage.removeItem('handyman_order'); // Очищаем корзину
            window.location.href = 'index.html'; // Возвращаем на главную
        });
    </script>
</body>
</html>
